services:

  mongo:
    image: mongo:7
    container_name: mongo-pf
    ports:
      - "27017:27017"

  postgres:
    image: postgres:16
    container_name: postgres-pf
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: pf
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: redis-pf
    ports:
      - "6379:6379"